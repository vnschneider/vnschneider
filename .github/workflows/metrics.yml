name: Profile metrics

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      panel:
        description: Panel to regenerate
        type: choice
        default: all
        options: [all, overview, development, collaboration, activity]

permissions:
  contents: read

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: GitHub overview
        if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.panel == 'all' || inputs.panel == 'overview')"
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # stable latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          repositories_skipped: ${{ secrets.METRICS_EXCLUDED_REPOS }}
          committer_token: ${{ github.token }}
          committer_branch: main
          user: vnschneider
          template: classic
          config_timezone: America/Sao_Paulo
          config_display: regular
          plugins_errors_fatal: yes
          filename: assets/metrics/overview.svg
          base: header, activity, community, repositories
          config_order: base.header, base.activity, base.community, base.repositories

      - name: Languages and organization contributions
        if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.panel == 'all' || inputs.panel == 'development')"
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # stable latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          repositories_skipped: ${{ secrets.METRICS_EXCLUDED_REPOS }}
          committer_token: ${{ github.token }}
          committer_branch: main
          user: vnschneider
          template: classic
          config_timezone: America/Sao_Paulo
          config_display: large
          plugins_errors_fatal: yes
          filename: assets/metrics/development.svg
          base: ""
          config_order: languages, notable
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: no
          plugin_notable_types: commit, pull_request

      - name: Pull requests and issues
        if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.panel == 'all' || inputs.panel == 'collaboration')"
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # stable latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          repositories_skipped: ${{ secrets.METRICS_EXCLUDED_REPOS }}
          committer_token: ${{ github.token }}
          committer_branch: main
          user: vnschneider
          template: classic
          config_timezone: America/Sao_Paulo
          config_display: large
          plugins_errors_fatal: yes
          filename: assets/metrics/collaboration.svg
          base: ""
          config_order: followup
          plugin_followup: yes
          plugin_followup_sections: user

      - name: Recent public activity
        if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.panel == 'all' || inputs.panel == 'activity')"
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          repositories_skipped: ${{ secrets.METRICS_EXCLUDED_REPOS }}
          committer_token: ${{ github.token }}
          committer_branch: main
          user: vnschneider
          template: classic
          config_timezone: America/Sao_Paulo
          config_display: regular
          plugins_errors_fatal: yes
          filename: assets/metrics/activity.svg
          base: ""
          plugin_activity: yes
          plugin_activity_visibility: public
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_filter: push, issue, pr, release, review
          plugin_activity_timestamps: yes
