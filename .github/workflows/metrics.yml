name: Profile metrics

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: read

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Overview and contribution calendar
        if: '!cancelled()'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # stable latest
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          committer_branch: main
          user: vnschneider
          template: classic
          config_timezone: America/Sao_Paulo
          config_display: large
          plugins_errors_fatal: yes
          filename: assets/metrics/overview.svg
          base: header, activity, community, repositories
          config_order: base.header, base.activity, base.community, base.repositories, isocalendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages and organization contributions
        if: '!cancelled()'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # stable latest
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          committer_branch: main
          user: vnschneider
          template: classic
          config_timezone: America/Sao_Paulo
          config_display: large
          plugins_errors_fatal: yes
          filename: assets/metrics/development.svg
          base: ""
          config_order: languages, notable
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          plugin_notable_types: commit, pull_request

      - name: Pull requests and achievements
        if: '!cancelled()'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # stable latest
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          committer_branch: main
          user: vnschneider
          template: classic
          config_timezone: America/Sao_Paulo
          config_display: large
          plugins_errors_fatal: yes
          filename: assets/metrics/collaboration.svg
          base: ""
          config_order: followup, achievements
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 6
          plugin_achievements_threshold: C
          plugin_achievements_secrets: no
