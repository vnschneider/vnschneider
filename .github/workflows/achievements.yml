name: Profile achievements
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-achievements
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Compact achievements
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          repositories_skipped: ${{ secrets.METRICS_EXCLUDED_REPOS }}
          committer_token: ${{ github.token }}
          committer_branch: main
          user: vnschneider
          filename: assets/metrics/achievements.svg
          base: ""
          config_timezone: America/Sao_Paulo
          config_display: large
          plugins_errors_fatal: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 6
          plugin_achievements_threshold: C
          plugin_achievements_secrets: no
